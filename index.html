<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SHARDSTORM — Forge Your Storm</title>
<meta name="description" content="Survive endless waves. Enemies drop weapon fragments that forge into orbiting relics. Merge, upgrade, evolve. How long can you last?">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#0a0e1a;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #game-container { width:100%; height:100%; }
  canvas { display:block; }
  /* Simple CSS loader shown until Phaser boots */
  #loader {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:#0a0e1a;
    color:#7df; font-family:monospace; z-index:10; transition:opacity .4s;
  }
  #loader .spin {
    width:42px; height:42px; border:4px solid #123; border-top-color:#4df;
    border-radius:50%; animation:sp 0.8s linear infinite; margin-bottom:14px;
  }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="loader"><div class="spin"></div>FORGING…</div>
<div id="game-container"></div>

<!-- Phaser 3 engine -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

<!-- Game modules (order matters: data & services first, scenes after, main last) -->
<script src="js/data.js"></script>
<script src="js/save.js"></script>
<script src="js/audio.js"></script>
<script src="js/textures.js"></script>
<script src="js/scenes/BootScene.js"></script>
<script src="js/scenes/MenuScene.js"></script>
<script src="js/scenes/GameScene.js"></script>
<script src="js/scenes/UIScene.js"></script>
<script src="js/scenes/GameOverScene.js"></script>
<script src="js/main.js"></script>
</body>
</html>
